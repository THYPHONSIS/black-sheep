[package]
name = "black-sheep"
version = "0.2.0"
description = "Local LaTeX studio with opt-in scholarly metadata"
authors = ["Black sheep contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "black_sheep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
